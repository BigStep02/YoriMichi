spring:
  application:
    name: YoriMichi
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:framezero}
    password: ${DB_PASSWORD:Framezero_1234}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      initialization-fail-timeout: 60000
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true   # 버전 번호가 늦게 들어온 마이그레이션(V23·V24)도 적용
    connect-retries: 10
    connect-retries-interval: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: never
  docker:
    compose:
      lifecycle-management: start-only

server:
  port: 8080
  forward-headers-strategy: framework  # 터널/프록시 뒤에서 원래 https 주소·호스트를 인식 (CORS 오판 방지)

jwt:
  # 운영 환경에서는 반드시 JWT_SECRET 환경변수로 덮어써야 함 (최소 32자)
  secret: ${JWT_SECRET:yorimichi-dev-secret-key-must-be-at-least-32-bytes}
  expiration-ms: 7200000

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  fallback-models: ${GEMINI_FALLBACK_MODELS:}

app:
  dev-emails: ${APP_DEV_EMAILS:}   # 개발자 계정(쉼표로 여러 개) — 이 계정만 화면에서 mock 사용 가능
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.trycloudflare.com}
  places:
    daily-nearby-limit: ${PLACES_NEARBY_LIMIT:200}
    daily-detail-limit: ${PLACES_DETAIL_LIMIT:200}