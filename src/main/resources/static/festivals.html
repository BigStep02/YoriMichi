<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>근처 축제 · YoriMichi</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
  {"imports":{"three":"/js/vendor/three/three.module.min.js","three/addons/":"/js/vendor/three/addons/"}}
  </script>
  <script src="/js/vendor/gsap/gsap.min.js" defer></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070A1A">
  <link rel="icon" type="image/png" href="/images/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="YoriMichi">

<body class="hanabi-bg" data-page="festivals">
  <canvas id="hanabi-stage" data-scene="sando" aria-hidden="true"></canvas>
  <div class="hanabi-shade" aria-hidden="true"></div>
  <header id="app-header"></header>
  <main class="container">
    <a class="back" href="/" id="back-link">홈으로</a>
    <h1 class="draw-title">근처 축제</h1>
    <p class="muted draw-sub">여행 기간에 근처에서 열리는 마쓰리예요.</p>

    <div id="search-bar"></div>

    <section class="draw-panel" id="draw-panel">
      <div class="dp-idle">
        <span class="dp-lantern" aria-hidden="true"><span lang="ja">祭</span></span>
        <div class="dp-desc">
          <span class="dp-kicker" lang="ja">今日の縁</span>
          <b>축제 뽑기</b>
          <span class="dp-sub">지금 목록의 축제 중 하나</span>
        </div>
        <button type="button" class="dp-btn" id="dp-draw-btn">뽑기</button>
      </div>
      <div class="dp-result" id="dp-result" hidden></div>
    </section>

    <div class="list-tools">
      <div class="seg" role="radiogroup" aria-label="검색 반경">
        <button type="button" role="radio" data-radius="10">10km</button>
        <button type="button" role="radio" data-radius="30">30km</button>
        <button type="button" role="radio" data-radius="50">50km</button>
      </div>
    </div>

    <div id="notice"></div>
    <p class="list-count muted" id="count"></p>
    <div id="results" aria-live="polite"></div>
  </main>
  <script type="module" src="/js/festivals.js"></script>
  <script type="module" src="/js/night-bg.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
