<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코스 뽑기 · YoriMichi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070A1A">
  <script type="importmap">
  {"imports":{"three":"/js/vendor/three/three.module.min.js","three/addons/":"/js/vendor/three/addons/"}}
  </script>
  <script src="/js/vendor/gsap/gsap.min.js" defer></script>
  <link rel="icon" type="image/png" href="/images/icons/favicon-64.png?v=4">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png?v=4">
  <meta name="apple-mobile-web-app-title" content="YoriMichi">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script type="speculationrules">{"prefetch":[{"source":"document","where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
  <script src="/js/transition.js" defer></script>
  <script type="module" src="/js/router.js"></script>
</head>
<body class="hanabi" data-page="draw">
  <canvas id="hanabi-stage" aria-hidden="true"></canvas>
  <div id="hanabi-flash" aria-hidden="true"></div>
  <button id="hanabi-skip" type="button" hidden>건너뛰기 ›</button>
  <header id="app-header"></header>
  <main class="container">
    <a class="back" href="/" id="back-link">홈으로</a>

    <!-- 1) 조건 고르기 -->
    <section id="step-form">
      <h1 class="draw-title">코스 뽑기</h1>
      <p class="muted draw-sub">명소나 축제를 먼저 고르고, 근처 맛집을 연결해 드려요.</p>

      <div id="search-bar"></div>

      <div class="opt-group">
        <div class="opt-label">코스 시작점</div>
        <div class="course-preset-row" role="radiogroup" aria-label="코스 시작점" id="preset-group">
          <button class="preset-btn" type="button" role="radio" data-v="SPOT_RESTAURANT" aria-checked="true">
            <b><svg class="torii" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 4.4c3.4 1.4 6.9 2 10.5 2s7.1-.6 10.5-2l-.7 2.6c-3.2 1-6.5 1.5-9.8 1.5S5.4 8 2.2 7z" fill="#2A1208"/><path d="M1.7 4.5c3.4 1.3 6.8 1.9 10.3 1.9s6.9-.6 10.3-1.9" fill="none" stroke="#F2C14E" stroke-width=".9" stroke-linecap="round"/><rect x="3.8" y="8.3" width="16.4" height="1.5" rx=".3" fill="#E8462E"/><rect x="11.25" y="9.6" width="1.5" height="2" fill="#E8462E"/><rect x="2.8" y="11.4" width="18.4" height="1.7" rx=".4" fill="#E8462E"/><path d="M5.6 9.6h2.1l.3 10.2H5.3z" fill="#E8462E"/><path d="M16.3 9.6h2.1l.3 10.2h-2.7z" fill="#E8462E"/><rect x="4.7" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/><rect x="15.5" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/></svg> 명소 → 맛집</b>
            <small>신사·공원·미술관 등</small>
          </button>
          <button class="preset-btn" type="button" role="radio" data-v="FESTIVAL_RESTAURANT" aria-checked="false">
            <b>🏮 축제 → 맛집</b>
            <small>근처 마쓰리·이벤트</small>
          </button>
        </div>
      </div>

      <div class="opt-group" id="kind-group">
        <div class="opt-label">놀거리 종류 <small class="opt-hint">여러 개 고를 수 있어요</small></div>
        <div class="chips cat-scroll" role="group" aria-label="놀거리 종류 (여러 개 선택)" data-opt="kinds" data-multi>
          <button type="button" data-v="ALL" aria-pressed="true">전체</button>
          <button type="button" data-v="SHRINE_TEMPLE" aria-pressed="false"><svg class="torii" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 4.4c3.4 1.4 6.9 2 10.5 2s7.1-.6 10.5-2l-.7 2.6c-3.2 1-6.5 1.5-9.8 1.5S5.4 8 2.2 7z" fill="#2A1208"/><path d="M1.7 4.5c3.4 1.3 6.8 1.9 10.3 1.9s6.9-.6 10.3-1.9" fill="none" stroke="#F2C14E" stroke-width=".9" stroke-linecap="round"/><rect x="3.8" y="8.3" width="16.4" height="1.5" rx=".3" fill="#E8462E"/><rect x="11.25" y="9.6" width="1.5" height="2" fill="#E8462E"/><rect x="2.8" y="11.4" width="18.4" height="1.7" rx=".4" fill="#E8462E"/><path d="M5.6 9.6h2.1l.3 10.2H5.3z" fill="#E8462E"/><path d="M16.3 9.6h2.1l.3 10.2h-2.7z" fill="#E8462E"/><rect x="4.7" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/><rect x="15.5" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/></svg> 신사·절</button>
          <button type="button" data-v="PARK_GARDEN" aria-pressed="false">🌸 공원·정원</button>
          <button type="button" data-v="HISTORIC" aria-pressed="false">🏯 성·옛 거리</button>
          <button type="button" data-v="MUSEUM" aria-pressed="false">🏛 박물관·미술관</button>
          <button type="button" data-v="VIEWPOINT" aria-pressed="false">🌄 전망·경치</button>
          <button type="button" data-v="MARKET" aria-pressed="false">🏮 시장</button>
          <button type="button" data-v="AMUSEMENT" aria-pressed="false">🎡 유원지·수족관</button>
          <button type="button" data-v="ONSEN" aria-pressed="false">♨ 온천</button>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-label">명소 검색 범위</div>
        <div class="chips" role="radiogroup" aria-label="범위" data-opt="radiusKm">
          <button type="button" role="radio" data-v="5">5km</button>
          <button type="button" role="radio" data-v="10" aria-checked="true">10km</button>
          <button type="button" role="radio" data-v="20">20km</button>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-label">맛집은 명소에서</div>
        <div class="chips" role="radiogroup" aria-label="맛집 거리" data-opt="restaurantRadiusM">
          <button type="button" role="radio" data-v="400">도보 5분 <small>400m</small></button>
          <button type="button" role="radio" data-v="800" aria-checked="true">도보 10분 <small>800m</small></button>
          <button type="button" role="radio" data-v="1500">도보 20분 <small>1.5km</small></button>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-label">맛집 예산</div>
        <div class="chips" role="radiogroup" aria-label="예산" data-opt="maxPrice">
          <button type="button" role="radio" data-v="" aria-checked="true">상관없음</button>
          <button type="button" role="radio" data-v="1">¥ 저렴</button>
          <button type="button" role="radio" data-v="2">¥¥ 보통</button>
          <button type="button" role="radio" data-v="3">¥¥¥ 여유</button>
        </div>
      </div>

      <label class="switch-row">
        <span>지금 영업 중인 맛집만</span>
        <input type="checkbox" data-opt="openNow" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <button type="button" class="cta draw-btn" data-draw>
        <span class="cta-icon" data-icon="route"></span>
        <span class="cta-text"><b>코스 뽑기</b><span>명소/축제와 근처 맛집을 하나로</span></span>
      </button>
    </section>

    <!-- 2) 뽑는 중 -->
    <section id="step-loading" class="draw-loading" hidden aria-live="polite">
      <div class="multi-swing" data-illust></div>
      <p class="loading-title">코스를 엮는 중…</p>
      <p class="muted" data-loading-sub>근처 명소와 맛집을 연결하고 있어요</p>
    </section>

    <!-- 3) 결과 -->
    <section id="step-result" hidden aria-live="polite"></section>
  </main>
  <script type="module" src="/js/draw.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
