<body class="hanabi-bg" data-page="spots">
  <canvas id="hanabi-stage" data-scene="momiji" aria-hidden="true"></canvas>
  <div class="hanabi-shade" aria-hidden="true"></div>
  <header id="app-header"></header>
  <main class="container">
    <a class="back" href="/" id="back-link">홈으로</a>
    <h1 class="draw-title">주변 놀거리</h1>
    <p class="muted draw-sub">신사·공원·전망대·박물관을 가까운 순으로 보여 드려요.</p>

    <div id="search-bar"></div>

    <section class="draw-panel" id="draw-panel">
      <div class="dp-idle">
        <span class="dp-lantern" aria-hidden="true"><span lang="ja">遊</span></span>
        <div class="dp-desc">
          <span class="dp-kicker" lang="ja">今日の縁</span>
          <b>놀거리 뽑기</b>
          <span class="dp-sub">지금 영업 중인 놀거리 중 한 곳</span>
        </div>
        <button type="button" class="dp-btn" id="dp-draw-btn">뽑기</button>
      </div>
      <div class="dp-result" id="dp-result" hidden></div>
    </section>

    <div class="chips cat-scroll" role="group" aria-label="종류 (여러 개 선택)" data-multi>
      <button type="button" data-v="ALL" aria-pressed="true">전체</button>
      <button type="button" data-v="SHRINE_TEMPLE" aria-pressed="false"><svg class="torii" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 4.4c3.4 1.4 6.9 2 10.5 2s7.1-.6 10.5-2l-.7 2.6c-3.2 1-6.5 1.5-9.8 1.5S5.4 8 2.2 7z" fill="#2A1208"/><path d="M1.7 4.5c3.4 1.3 6.8 1.9 10.3 1.9s6.9-.6 10.3-1.9" fill="none" stroke="#F2C14E" stroke-width=".9" stroke-linecap="round"/><rect x="3.8" y="8.3" width="16.4" height="1.5" rx=".3" fill="#E8462E"/><rect x="11.25" y="9.6" width="1.5" height="2" fill="#E8462E"/><rect x="2.8" y="11.4" width="18.4" height="1.7" rx=".4" fill="#E8462E"/><path d="M5.6 9.6h2.1l.3 10.2H5.3z" fill="#E8462E"/><path d="M16.3 9.6h2.1l.3 10.2h-2.7z" fill="#E8462E"/><rect x="4.7" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/><rect x="15.5" y="19.4" width="3.8" height="1.8" rx=".4" fill="#2A1208"/></svg> 신사·절</button>
      <button type="button" data-v="PARK_GARDEN" aria-pressed="false">🌸 공원·정원</button>
      <button type="button" data-v="HISTORIC" aria-pressed="false">🏯 성·옛 거리</button>
      <button type="button" data-v="MUSEUM" aria-pressed="false">🏛 박물관·미술관</button>
      <button type="button" data-v="VIEWPOINT" aria-pressed="false">🌄 전망·경치</button>
      <button type="button" data-v="MARKET" aria-pressed="false">🏮 시장</button>
      <button type="button" data-v="AMUSEMENT" aria-pressed="false">🎡 유원지·수족관</button>
      <button type="button" data-v="ONSEN" aria-pressed="false">♨ 온천</button>
    </div>

    <div class="list-tools">
      <div class="seg" role="radiogroup" aria-label="검색 반경">
        <button type="button" role="radio" data-radius="5">5km</button>
        <button type="button" role="radio" data-radius="10">10km</button>
        <button type="button" role="radio" data-radius="30">30km</button>
      </div>
    </div>

    <label class="switch-row compact">
      <span>지금 영업 중인 곳만</span>
      <input type="checkbox" id="open-only">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <p class="list-count muted" id="count"></p>
    <div id="list" aria-live="polite"></div>
  </main>
  <script type="module" src="/js/spots.js"></script>
  <script type="module" src="/js/night-bg.js"></script>
  <script type="module" src="/js/pwa.js"></script>
