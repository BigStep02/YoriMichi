# main 에 push → 빌드·테스트 → 통과하면 deploy 브랜치를 그 커밋으로 옮김
# 서버(EC2)는 1분마다 deploy 브랜치를 확인해서 새 커밋이면 배포함 (deploy/update.sh)
# → 테스트를 통과한 코드만 서버로 감. 서버 열쇠는 GitHub 에 없음.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # deploy 브랜치를 옮기기 위해

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    services:
      oracle:   # contextLoads 테스트용 DB
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: ci_only_pass_123
          APP_USER: framezero
          APP_USER_PASSWORD: ci_only_pass_123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    env:
      DB_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      DB_USERNAME: framezero
      DB_PASSWORD: ci_only_pass_123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Gradle 빌드 + 테스트
        run: chmod +x gradlew && ./gradlew build --no-daemon

  release:
    name: 배포 표시 (deploy 브랜치)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: deploy 브랜치를 이 커밋으로
        run: git push origin HEAD:refs/heads/deploy --force
